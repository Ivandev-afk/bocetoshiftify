<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F172A">
    <title>Turno en Salón Doña Cecilia | Shiftify</title>
  <link rel="stylesheet" href="../assets/css/tokens.css?v=5">
  <link rel="stylesheet" href="../assets/css/styles.css?v=5">
</head>
<body class="pagina-turno">
  <p class="maqueta-aviso">Maqueta con datos de ejemplo · <a href="index.html">Ver todas las pantallas</a></p>
  <main class="turno">
    <article class="turno__tarjeta">
      <img class="marca__imagen" src="../assets/img/shiftify-logo.png" alt="Shiftify">

              <!-- En todas las pantallas: la persona siempre sabe en qué negocio está su turno -->
        <p class="turno__negocio"><span>Estás en la fila de</span> <strong>Salón Doña Cecilia</strong></p>

              <h1>Pide tu turno</h1>
        <p class="turno__nota">Sin filas ni papeles: espera donde quieras y sigue la fila desde aquí.</p>


        <form class="app-formulario app-formulario--apilado" action="turno-esperando.html" method="get">
          <label for="nombre">Tu nombre</label>
          <input id="nombre" type="text" maxlength="100" autocomplete="name" placeholder="Tu nombre" value="">
          <button class="boton" type="submit">Tomar turno <span aria-hidden="true">→</span></button>
        </form>

          </article>
  </main>
</body>
</html>
