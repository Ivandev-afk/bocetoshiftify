    <title>Turno en Salón Doña Cecilia | Shiftify</title>
  <link rel="stylesheet" href="../assets/css/tokens.css?v=6">

<body class="pagina-turno">
  <p class="maqueta-aviso">Maqueta con datos de ejemplo · <a href="index.html">Ver todas las pantallas</a></p>
  <main class="turno">
    <article class="turno__tarjeta">
      <img class="marca__imagen" src="../assets/img/shiftify-logo.png" alt="Shiftify">

              <!-- En todas las pantallas: la persona siempre sabe en qué negocio está su turno -->
        <p class="turno__negocio"><span>Estás en la fila de</span> <strong>Salón Doña Cecilia</strong></p>

              <h1>Tu turno, Valentina Ruiz</h1>
        <p class="turno__codigo">A-004</p>
        <p class="turno__estado">En la fila</p>

        <div class="turno__datos">
          <div><strong>3</strong><span>personas antes</span></div>
          <div><strong>~10</strong><span>minutos de espera</span></div>
        </div>
        <p class="turno__nota">Esta página se actualiza sola, no la cierres.</p>

        <!-- Para salir de la fila: libera el lugar y deja pedir un turno nuevo -->
        <form class="turno__cancelar" action="turno-pedir.html" method="get" onsubmit="return confirm('¿Cancelar tu turno A-004? Perderás tu lugar en la fila.')">
          <button type="submit">Cancelar mi turno</button>
        </form>

          </article>
  </main>
