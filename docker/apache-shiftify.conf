# Apache de Shiftify en el contenedor: bloquea lo que es solo para el servidor
<Directory /var/www/html>
    Options -Indexes
</Directory>

<DirectoryMatch "^/var/www/html/(includes|database|docs|docker)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "\.(sql|md|ps1|yml)$|^Dockerfile$">
    Require all denied
</FilesMatch>

# La raíz abre la landing
DirectoryIndex index.html index.php
